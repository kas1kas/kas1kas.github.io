<p><font color="#FFFF00">Pleasure point</font></p>
<p><font color="#FFFF00"><br>
  Oil on canvas, scumbling method<br>
  Dark dry paint was put on the canvas first without brush strokes and lighter 
  paint was added on top.<br>
  This layered effect gives the velvet texture feeling. Subtle contrast of one 
  color gives depth.<br>
  There is a calm and serene feeling.<br>
  </font></p>
